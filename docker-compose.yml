version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - visual-novel-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./server/data:/app/server/data
      - ./CacheImages:/app/server/CacheImages
    environment:
      - NODE_ENV=production
      - PORT=3001
    working_dir: /app/server
    command: ["node", "index.js"]
    networks:
      - visual-novel-network

networks:
  visual-novel-network:
    driver: bridge
